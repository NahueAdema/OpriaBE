name: Deploy backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opria-be-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrar y disparar deploy en Render
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' ||
         github.event.workflow_run.conclusion == 'success') &&
        vars.RENDER_DEPLOY_ENABLED == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout del commit verificado
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: npm run db:migrate

      - name: Trigger Render deploy hook
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo 'Falta el secreto RENDER_DEPLOY_HOOK_URL' >&2
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo 'Deploy hook de Render disparado'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Summary
        shell: bash
        run: |
          {
            echo '### Deploy backend'
            echo
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo '- Migraciones aplicadas y deploy hook de Render disparado.'
          } >> "$GITHUB_STEP_SUMMARY"
